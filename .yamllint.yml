# YAML style for every committed .yml/.yaml file (run in CI: yamllint --strict .).
extends: default

rules:
  line-length:
    max: 120
  document-start: disable
  # GitHub Actions' `on:` key is not a boolean.
  truthy:
    check-keys: false
  indentation:
    indent-sequences: consistent
  braces:
    max-spaces-inside: 1
  comments:
    min-spaces-from-content: 1

ignore: |
  .venv/
  data/
