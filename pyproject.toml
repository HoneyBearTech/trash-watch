# Settings for the repo's Python tooling. trash-watch is a single script, not a package; this file only
# configures ruff, pytest and coverage. Tools are pinned with hashes in requirements-dev.txt.

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# pyflakes/pycodestyle, bugbear, the bandit security rules (S), pylint errors and warnings, and the
# simplification, import and modernisation families. Exceptions are made per line, with a reason.
select = [
    "A", "ARG", "B", "BLE", "C4", "E", "F", "I", "ISC", "N", "PERF", "PIE", "PLE", "PLW", "PT", "RET", "RUF",
    "S", "SIM", "UP", "W",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", # pytest uses assert
    "S603", # the fixtures run git on throwaway repositories
    "S607",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-config", "--strict-markers", "-ra"]
# Any warning is a failure.
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["trash_watch"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ['if __name__ == "__main__":']
