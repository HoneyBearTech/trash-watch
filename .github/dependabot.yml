version: 2
# Patch and minor updates to the Python packages and Actions, and patch updates to the base image, are
# auto-merged once the required checks pass (workflows/dependabot-auto-merge.yml). Major updates and a new
# Python minor wait for a human, and a one-time check against a real Recyclarr config (make run-once).
updates:
  # The base image in the Dockerfile (version tag and digest).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees: ["HoneyBearTech"]

  # Runtime (requirements.txt) and the check and test tools (requirements-dev.txt), pinned with hashes.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees: ["HoneyBearTech"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees: ["HoneyBearTech"]
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
