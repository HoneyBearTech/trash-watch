name: Dependabot auto-merge

# Turns on GitHub's auto-merge for Dependabot's low-risk update PRs, so they're squash-merged once every
# required check passes (the main ruleset still decides: CI, CodeQL, dependency review, signed commits).
# Nothing is checked out or run from the PR; the job only reads Dependabot's metadata and calls `gh`.
# Merged updates reach Atlas only through a release and a digest bump there, which stay manual.
on: pull_request

permissions:
  contents: read

jobs:
  auto-merge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'HoneyBearTech/trash-watch'
    # Only this job writes, to turn on auto-merge for the PR.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Python packages and GitHub Actions: patch and minor updates. The base image: patch only (3.14.7 ->
      # 3.14.8); a new Python minor (3.14 -> 3.15) and every major update wait for a human, and a run-once
      # against a real Recyclarr config.
      - name: Enable auto-merge for patch and minor updates
        if: >-
          (steps.metadata.outputs.package-ecosystem != 'docker' &&
           (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
            steps.metadata.outputs.update-type == 'version-update:semver-minor')) ||
          (steps.metadata.outputs.package-ecosystem == 'docker' &&
           steps.metadata.outputs.update-type == 'version-update:semver-patch')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
