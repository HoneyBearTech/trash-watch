name: Release

# A release: pushing a version tag (vX.Y.Z) builds the trash-watch image for amd64 and arm64 and publishes
# it to GHCR (ghcr.io/<owner>/trash-watch). Tags: the version (1.2.3), major.minor (1.2) and latest. The
# image is pushed with SBOM and SLSA provenance attestations and signed keylessly with cosign (Sigstore,
# identity = this workflow on the tag). The GitHub Release carries the CHANGELOG.md section for the
# version, a source archive (with LICENSE), the image digest, a signed SHA256SUMS and SLSA build
# provenance for those files, as a Sigstore bundle and as in-toto JSON Lines.
# How to verify: docs/verifying-releases.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish the image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing: the Sigstore certificate comes from this job's OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute the image name
        id: names
        # GHCR image paths must be all-lowercase; github.repository_owner keeps the account's casing.
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "ghcr=ghcr.io/${owner}/trash-watch" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.names.outputs.ghcr }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          # Releases are built from scratch: an Actions cache is scoped to the tag that writes it, so it
          # could never be read again.
          no-cache: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          GHCR_IMAGE: ${{ steps.names.outputs.ghcr }}
        run: |
          cosign sign --yes "${GHCR_IMAGE}@${DIGEST}"
          echo "${GHCR_IMAGE}@${DIGEST}" > image.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image
          path: image.txt
          retention-days: 1

  release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      id-token: write # keyless signing of SHA256SUMS and of the provenance
      attestations: write # store the provenance attestation in GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image

      - name: Source archive and checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          git archive --format=tar.gz --prefix="trash-watch-${version}/" -o "trash-watch-${version}.tar.gz" HEAD
          sha256sum "trash-watch-${version}.tar.gz" image.txt > SHA256SUMS
          cat image.txt SHA256SUMS

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the checksums
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      # SLSA build provenance for every file in SHA256SUMS: signed (Sigstore), stored as a GitHub
      # attestation (gh attestation verify) and attached as the full Sigstore bundle.
      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: SHA256SUMS

      - name: Release notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          version="${TAG#v}"
          cp "$BUNDLE" "trash-watch-${version}.provenance.sigstore.json"
          # The same provenance as in-toto JSON Lines (one DSSE envelope per line), the format tools such as
          # OpenSSF Scorecard look for in release assets.
          jq -c '.dsseEnvelope' "$BUNDLE" > "trash-watch-${version}.intoto.jsonl"
          test -s "trash-watch-${version}.intoto.jsonl"
          # The "## [x.y.z]" section of CHANGELOG.md, up to the next "## [" heading.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          # Repo-relative links would resolve against the release page; point them at the tag.
          perl -pi -e 's{\]\((?!https?://|#)([^)]+)\)}{](https://github.com/$ENV{REPO}/blob/$ENV{TAG}/$1)}g' notes.md
          verify="https://github.com/${REPO}/blob/${TAG}/docs/verifying-releases.md"
          printf '\n---\nVerify the image and this release: [docs/verifying-releases.md](%s)\n' "$verify" >> notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" --repo "$REPO" --verify-tag \
            --title "trash-watch ${TAG}" --notes-file notes.md \
            trash-watch-*.tar.gz image.txt SHA256SUMS SHA256SUMS.sigstore.json trash-watch-*.provenance.sigstore.json \
            trash-watch-*.intoto.jsonl
