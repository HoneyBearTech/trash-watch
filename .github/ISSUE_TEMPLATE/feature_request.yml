name: Feature request
description: Suggest a new check, a notification channel, or another improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: >-
        Please check the [roadmap](https://github.com/HoneyBearTech/trash-watch/blob/main/docs/roadmap.md)
        first: it lists what's planned and what trash-watch deliberately won't do.
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: The drift or situation you want trash-watch to catch, or what's hard today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
